[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ios-control-mcp"
version = "1.0.0"
description = "MCP server to screenshot and control an iPhone from macOS over CoreDevice"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Als0m3" }]
keywords = ["mcp", "ios", "iphone", "automation", "coredevice", "pymobiledevice3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = ["pymobiledevice3>=11.23,<12"]

[project.urls]
Homepage = "https://github.com/Als0m3/ios-control-mcp"
Issues = "https://github.com/Als0m3/ios-control-mcp/issues"

[project.scripts]
ios-control-mcp = "ios_control_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ios_control_mcp"]
